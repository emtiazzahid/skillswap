<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			html,
			body {
				margin: 0;
				width: 512px;
				height: 512px;
				overflow: hidden;
				background: #98643d;
			}
			.paper {
				position: absolute;
				left: 80px;
				top: 128px;
				width: 352px;
				height: 304px;
				background: #fbf7ee;
				border-radius: 8px;
				transform: rotate(-4deg);
				box-shadow: 0 8px 0 rgba(0, 0, 0, 0.15);
			}
			.pin {
				position: absolute;
				left: 208px;
				top: 88px;
				width: 96px;
				height: 96px;
				border-radius: 50%;
				background: #d64545;
				box-shadow:
					inset -12px -12px 0 rgba(0, 0, 0, 0.2),
					0 10px 10px -6px rgba(0, 0, 0, 0.5);
			}
			.l1 {
				position: absolute;
				left: 144px;
				top: 240px;
				width: 224px;
				height: 24px;
				background: #1f1a15;
				opacity: 0.8;
				border-radius: 4px;
				transform: rotate(-4deg);
			}
			.l2 {
				position: absolute;
				left: 152px;
				top: 304px;
				width: 160px;
				height: 24px;
				background: #1f1a15;
				opacity: 0.5;
				border-radius: 4px;
				transform: rotate(-4deg);
			}
		</style>
	</head>
	<body>
		<div class="paper"></div>
		<div class="l1"></div>
		<div class="l2"></div>
		<div class="pin"></div>
	</body>
</html>
