name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - id: token
        name: Check for Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN secret not set; skipping deploy (deploy locally with pnpm deploy)."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.has_token == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.token.outputs.has_token == 'true'
        with: { version: 10 }
      - uses: actions/setup-node@v4
        if: steps.token.outputs.has_token == 'true'
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
        if: steps.token.outputs.has_token == 'true'
      - run: pnpm build
        if: steps.token.outputs.has_token == 'true'
      - run: pnpm exec wrangler d1 migrations apply skillswap-db --remote
        if: steps.token.outputs.has_token == 'true'
      - run: pnpm exec wrangler deploy
        if: steps.token.outputs.has_token == 'true'
